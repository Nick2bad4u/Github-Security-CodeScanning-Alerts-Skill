# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Python Tests"

run-name: "Python Tests • ${{ github.ref_name }} @${{ github.actor }}"

on:
    pull_request:
    push:
        branches:
            - "main"
    workflow_dispatch:

defaults:
    run:
        shell: "bash"

permissions:
    contents: "read"

concurrency:
    group: "python-tests-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

jobs:
    python:
        name: "Python tests"
        runs-on: "ubuntu-latest"
        timeout-minutes: 10
        permissions:
            contents: "read"
            id-token: "write"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Python"
              uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
              with:
                  python-version: "3.14"
                  cache: "pip"
                  cache-dependency-path: "requirements-dev.txt"

            - name: "Install Python dependencies"
              run: "python -m pip install -r requirements-dev.txt"

            - name: "Run coverage tests"
              run: "npm run test:python:coverage"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "test-report.junit.xml"
                  flags: "python"
                  name: "python-junit"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5" # v7.1.1
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "coverage.xml"
                  flags: "python"
                  name: "python-coverage"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true
